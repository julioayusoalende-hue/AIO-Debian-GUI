name: Publish testing prerelease

on:
  push:
    branches: [testing]

permissions:
  contents: read

jobs:
  testing:
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-24.04
    concurrency:
      group: aio-gh-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3 python3-gi gir1.2-gtk-3.0 gir1.2-vte-2.91 librsvg2-common shellcheck desktop-file-utils appstream pkexec xvfb xauth gnupg
      - name: Run checks
        run: xvfb-run -a bash scripts/check.sh
      - name: Verify signed APT publisher
        run: python3 scripts/test-host-package.py
      - name: Calculate testing version from latest stable release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName --jq .tagName)
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::La última versión estable no tiene formato vX.Y.Z"; exit 1;
          }
          stable_control=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/package/DEBIAN/control?ref=$tag" | sed -n 's/^Version: //p')
          version=$(bash scripts/testing-version.sh "$tag" "$stable_control" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")
          testing_tag="testing-v${version/\~/-}"
          git check-ref-format "refs/tags/$testing_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$testing_tag" >> "$GITHUB_OUTPUT"
      - name: Build and verify testing package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/build-deb.sh --testing-version "$VERSION"
          AIO_VERSION="$(dpkg-deb -f "dist/aio-debian-gui_${VERSION}_all.deb" Version)"
          bash ayusos-control-center/build-deb.sh --aio-release-version "$AIO_VERSION"
          cp "ayusos-control-center/dist/ayusos-control-center_${VERSION}_all.deb" dist/
          cd dist
          cp "aio-debian-gui_${VERSION}_all.deb" "aio-debian-gui_${VERSION/\~/-}_all.deb"
          cp "ayusos-control-center_${VERSION}_all.deb" "ayusos-control-center_${VERSION/\~/-}_all.deb"
          sha256sum "aio-debian-gui_${VERSION/\~/-}_all.deb" "ayusos-control-center_${VERSION/\~/-}_all.deb" > SHA256SUMS
          sha256sum --check SHA256SUMS
          dpkg-deb --fsys-tarfile "aio-debian-gui_${VERSION/\~/-}_all.deb" |
            tar -xOf - ./usr/share/aio-debian-gui/release-notes.txt |
            tail -n +2 > testing-notes.md
          test -s testing-notes.md
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/aio-debian-gui_${VERSION/\~/-}_all.deb" \
            "dist/ayusos-control-center_${VERSION/\~/-}_all.deb" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "AiO Debian GUI $VERSION (testing)" \
            --notes-file dist/testing-notes.md

      - name: Checkout APT repository
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: apt-site
      - name: Sign and deploy the Testing APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/aio-testing-gpg.XXXXXXXX")
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s\n' 'allow-loopback-pinentry' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          APT_CHANNEL=testing bash scripts/publish-apt-repo.sh \
            "dist/aio-debian-gui_${VERSION}_all.deb" apt-site "" "dist/ayusos-control-center_${VERSION}_all.deb"
          git -C apt-site config user.name 'github-actions[bot]'
          git -C apt-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C apt-site add -- apt-testing
          if ! git -C apt-site diff --cached --quiet; then
            git -C apt-site commit -m "Publish Testing APT ${VERSION}"
            git -C apt-site push origin HEAD:gh-pages
          fi
