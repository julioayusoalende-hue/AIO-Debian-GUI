name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

env:
  PYTHON_VERSION: '3.11'
  DEBIAN_FRONTEND: noninteractive

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-mock

      - name: Run ruff
        run: |
          ruff check package/usr/lib/aio-debian-gui/ software_manager_enhanced/ tests/
          ruff format --check package/usr/lib/aio-debian-gui/ software_manager_enhanced/ tests/

      - name: Run mypy
        run: |
          mypy package/usr/lib/aio-debian-gui/aio_core/ package/usr/lib/aio-debian-gui/ui/ --ignore-missing-imports || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libglib2.0-dev libcairo2-dev libgirepository1.0-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-cov

      - name: Run unit tests
        run: |
          cd tests
          python -m pytest test_backend.py test_admin.py -v --cov=../package/usr/lib/aio-debian-gui/software_manager --cov=../package/usr/lib/aio-debian-gui/aio_core

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests

  gui-tests:
    name: GUI Tests (xvfb)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libglib2.0-dev libcairo2-dev libgirepository1.0-dev \
            pkg-config \
            xauth

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-xvfb

      - name: Run GUI tests with xvfb
        run: |
          cd tests
          xvfb-run -a python -m pytest test_gui.py -v || true

      # GUI tests are optional for now - mark as allowed to fail
      # Uncomment when GUI tests are stable:
      # continue-on-error: true

  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper \
            dh-python \
            python3-all \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            libglib2.0-dev

      - name: Build package
        run: |
          cd package
          dpkg-buildpackage -b -us -uc

      - name: Verify package
        run: |
          cd ..
          dpkg -I package/*.deb
          dpkg -c package/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aio-debian-gui-deb
          path: package/*.deb
          retention-days: 30

  build-testing-deb:
    name: Build Testing DEB
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper \
            dh-python \
            python3-all \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            libglib2.0-dev

      - name: Build testing package
        run: |
          cd package
          dpkg-buildpackage -b -us -uc

      - name: Upload testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: aio-debian-gui-testing-deb
          path: package/*.deb
          retention-days: 7

  integration-test:
    name: Integration Test (Container)
    runs-on: ubuntu-latest
    needs: build-deb
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: aio-debian-gui-deb
          path: ./artifacts

      - name: Test install in Debian container
        run: |
          docker run --rm -v $(pwd)/artifacts:/artifacts debian:bookworm-slim bash -c "
            apt-get update &&
            apt-get install -y /artifacts/*.deb &&
            aio-debian-gui --version
          "

      - name: Test install in Ubuntu container
        run: |
          docker run --rm -v $(pwd)/artifacts:/artifacts ubuntu:noble bash -c "
            apt-get update &&
            apt-get install -y /artifacts/*.deb &&
            aio-debian-gui --version
          "

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, build-deb]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build-deb.result }}" != "success" ]]; then
            echo "❌ Some jobs failed"
            exit 1
          else
            echo "✅ All jobs passed"
          fi