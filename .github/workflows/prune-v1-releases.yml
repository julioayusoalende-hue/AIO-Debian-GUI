name: One-time cleanup of older v1 releases
on:
  push:
    branches:
      - maintenance/prune-v1-releases
    paths:
      - .github/workflows/prune-v1-releases.yml
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete v1 releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.2.3 v1.2.2 v1.2.1 v1.2.0 v1.1.0 v1.0.20 v1.0.19 v1.0.18 v1.0.17 v1.0.16 v1.0.15 v1.0.13 v1.0.12 v1.0.9 v1.0.8 v1.0.6 v1.0.5 v1.0.4 v1.0.3 v1.0.2 v1.0.1 v1.0.0; do
            echo "Removing $tag"
            gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done
          gh release view v1.2.4 --repo "$GH_REPO" >/dev/null
          for tag in v2.0.0 v2.0.9 v2.1.0; do
            gh release view "$tag" --repo "$GH_REPO" >/dev/null
          done
          echo "Preserved v1.2.4 and 2.x releases."
