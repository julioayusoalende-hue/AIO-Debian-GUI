name: Build Debian package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Debian package as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 librsvg2-common shellcheck desktop-file-utils pkexec xvfb xauth python3-pytest
          python3 -m venv --system-site-packages .venv-tools
          .venv-tools/bin/pip install ruff
      - name: Check and build the Debian package
        run: |
          set -euo pipefail
          xvfb-run -a bash scripts/check.sh
          .venv-tools/bin/ruff check --no-cache package/usr/bin/aio-debian-gui package/usr/lib/aio-debian-gui
          xvfb-run -a python3 -m pytest tests -q
          bash scripts/build-deb.sh
          cd dist
          sha256sum *.deb > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: aio-debian-gui-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: aio-debian-gui-deb
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          files=(aio-debian-gui_*_all.deb)
          [[ "${#files[@]}" -eq 1 && "${files[0]}" =~ ^aio-debian-gui_([0-9]+\.[0-9]+\.[0-9]+)_all\.deb$ ]]
          version="${BASH_REMATCH[1]}"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          python3 scripts/release-notes.py ../CHANGELOG.md "$previous" "$version" > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          gh release create "v$version" "${files[0]}" SHA256SUMS \
            --target "$GITHUB_SHA" --title "AiO Debian GUI $version" \
            --notes-file release-notes.md --latest
