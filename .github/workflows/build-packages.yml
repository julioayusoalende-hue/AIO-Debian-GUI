name: Build Debian packages

on:
  pull_request:
    branches: [main]
  push:
    branches: ['fix/**', main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev fakeroot \
            python3 python3-gi gir1.2-gtk-3.0 \
            shellcheck desktop-file-utils libfuse2t64 \
            curl ca-certificates file xz-utils \
            flatpak flatpak-builder appstream \
            python3-pil python3-numpy

      - name: Recolor original icon in Debian red
        run: python3 scripts/recolor-icon.py 350

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Install appimagetool
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output /usr/local/bin/appimagetool
          sudo chmod 0755 /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build DEB
        run: ./scripts/build-deb.sh

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Prepare GNOME Flatpak runtime and SDK
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          APP_ID=io.github.julioayusoalende_hue.aio_debian_gui
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=flatpak-repo \
            flatpak-build flatpak/$APP_ID.yml
          VERSION="$(sed -n 's/^Version: //p' package/DEBIAN/control)"
          flatpak build-bundle flatpak-repo \
            "dist/aio-debian-gui_${VERSION}_x86_64.flatpak" "$APP_ID" stable

      - name: Validate generated packages
        run: |
          set -euo pipefail
          DEB=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          APPIMAGE=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          FLATPAK=$(find dist -maxdepth 1 -name '*.flatpak' -print -quit)
          test -n "$DEB"
          test -n "$APPIMAGE"
          test -n "$FLATPAK"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" >/dev/null
          dpkg-deb --contents "$DEB" | grep -F 'usr/lib/aio-debian-gui/aio_core/updates.py' >/dev/null
          file "$APPIMAGE"
          chmod +x "$APPIMAGE"
          test -s "$APPIMAGE"
          # El runtime AppImage personalizado no garantiza --appimage-extract.
          # Validamos el AppDir antes de empaquetarlo en build-appimage.sh.
          test -f package/usr/share/icons/hicolor/512x512/apps/aio-debian-gui.png
          test -f package/usr/lib/aio-debian-gui/aio_core/history.py
          test -f package/usr/lib/aio-debian-gui/aio_core/updates.py
          file "$FLATPAK"
          appstreamcli validate --no-net flatpak/io.github.julioayusoalende_hue.aio_debian_gui.metainfo.xml
          # Comprobar los archivos en el árbol compilado: instalar Flatpak
          # sobre un runner CI sin sesión de usuario falla sin mensaje útil.
          test -f flatpak-build/files/share/icons/hicolor/512x512/apps/aio-debian-gui.png
          test -f flatpak-build/files/lib/aio-debian-gui/aio_core/updates.py
          test -f flatpak-build/files/lib/aio-debian-gui/aio_core/history.py
          test -x flatpak-build/files/share/aio-debian-gui/host-integration/aio-debian-gui-helper
          test -f flatpak-build/files/share/aio-debian-gui/host-integration/es.aiodebian.gui.policy
          test -s "$FLATPAK"
          (cd dist && sha256sum *.deb *.AppImage > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: aio-debian-gui-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^Version: //p' package/DEBIAN/control)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; not overwriting previously published assets."
            exit 0
          fi
          gh release create "$TAG" \
            dist/*.deb dist/*.AppImage dist/*.flatpak dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "AiO Debian GUI $VERSION" \
            --notes-file CHANGELOG.md \
            --latest
