name: Build Debian packages

on:
  pull_request:
    branches: [main]
  push:
    branches: ['fix/**', main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev fakeroot \
            python3 python3-gi gir1.2-gtk-3.0 \
            shellcheck desktop-file-utils libfuse2t64 \
            curl ca-certificates file xz-utils \
            flatpak flatpak-builder appstream

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Install appimagetool
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output /usr/local/bin/appimagetool
          sudo chmod 0755 /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build DEB
        run: ./scripts/build-deb.sh

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Prepare GNOME Flatpak runtime and SDK
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          APP_ID=io.github.julioayusoalende_hue.aio_debian_gui
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=flatpak-repo \
            flatpak-build flatpak/$APP_ID.yml
          flatpak build-bundle flatpak-repo \
            dist/aio-debian-gui_1.0.16_x86_64.flatpak "$APP_ID" stable

      - name: Validate generated packages
        run: |
          set -euo pipefail
          DEB=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          APPIMAGE=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          FLATPAK=$(find dist -maxdepth 1 -name '*.flatpak' -print -quit)
          test -n "$DEB"
          test -n "$APPIMAGE"
          test -n "$FLATPAK"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" >/dev/null
          file "$APPIMAGE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          rm -rf squashfs-root
          file "$FLATPAK"
          appstreamcli validate --no-net flatpak/io.github.julioayusoalende_hue.aio_debian_gui.metainfo.xml
          flatpak install --user --noninteractive --bundle "$FLATPAK"
          flatpak info --user --show-metadata io.github.julioayusoalende_hue.aio_debian_gui >/dev/null
          flatpak run --user --command=python3 io.github.julioayusoalende_hue.aio_debian_gui -c 'import gi; gi.require_version("Gtk", "3.0"); from gi.repository import Gtk'
          flatpak run --user --command=test io.github.julioayusoalende_hue.aio_debian_gui -x /app/share/aio-debian-gui/host-integration/aio-debian-gui-helper
          flatpak run --user --command=test io.github.julioayusoalende_hue.aio_debian_gui -f /app/share/aio-debian-gui/host-integration/es.aiodebian.gui.policy
          (cd dist && sha256sum *.deb *.AppImage > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: aio-debian-gui-1.0.16-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable v1.0.16 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.16 >/dev/null 2>&1; then
            echo "v1.0.16 already published; leaving existing release unchanged."
            exit 0
          fi
          gh release create v1.0.16 \
            dist/*.deb dist/*.AppImage dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "AiO Debian GUI 1.0.16" \
            --notes "Versión estable 1.0.16. Mejoras en tareas de mantenimiento y gestión de APT y repositorios Deb822, correcciones del estado y disponibilidad de Iniciar tareas en Cinnamon, y paquetes DEB, AppImage y Flatpak. Nota: el estado de las tareas puede seguir mostrando un aviso de tiempo de espera en ciertos entornos; la ejecución manual permanece disponible." \
            --latest
