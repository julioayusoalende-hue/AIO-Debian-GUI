name: Build Debian packages

on:
  pull_request:
    branches: [main]
  push:
    branches: ['fix/**', main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev fakeroot \
            python3 python3-gi gir1.2-gtk-3.0 \
            shellcheck desktop-file-utils libfuse2t64 \
            curl ca-certificates file xz-utils \
            flatpak flatpak-builder appstream xvfb xauth pkexec

      - name: Run project checks
        run: xvfb-run -a ./scripts/check.sh

      - name: Install appimagetool
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output /usr/local/bin/appimagetool
          sudo chmod 0755 /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Build DEB
        run: ./scripts/build-deb.sh

      - name: Test standalone scheduled maintenance without DEB
        env:
          AIO_SYSTEMD_INTEGRATION: '1'
        run: bash scripts/test-standalone-systemd.sh

      - name: Test scheduled maintenance with systemd
        env:
          AIO_SYSTEMD_INTEGRATION: '1'
        run: bash scripts/test-scheduler-systemd.sh

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Prepare GNOME Flatpak runtime and SDK
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          APP_ID=io.github.julioayusoalende_hue.aio_debian_gui
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=flatpak-repo \
            flatpak-build flatpak/$APP_ID.yml
          VERSION="$(sed -n 's/^Version: //p' package/DEBIAN/control)"
          flatpak build-bundle flatpak-repo \
            "dist/aio-debian-gui_${VERSION}_x86_64.flatpak" "$APP_ID" stable

      - name: Validate generated packages
        run: |
          set -euo pipefail
          DEB=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          APPIMAGE=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          FLATPAK=$(find dist -maxdepth 1 -name '*.flatpak' -print -quit)
          test -n "$DEB"
          test -n "$APPIMAGE"
          test -n "$FLATPAK"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" >/dev/null
          dpkg-deb --contents "$DEB" | grep -F 'usr/lib/aio-debian-gui/aio_core/updates.py' >/dev/null
          dpkg-deb --contents "$DEB" | grep -F 'usr/lib/aio-debian-gui/aio_core/scheduler.py' >/dev/null
          dpkg-deb --contents "$DEB" | grep -F 'usr/lib/systemd/system/aio-debian-gui-maintenance@.service' >/dev/null
          file "$APPIMAGE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/lib/aio-debian-gui/aio_core/history.py
          test -f squashfs-root/usr/lib/aio-debian-gui/aio_core/updates.py
          test -f squashfs-root/usr/share/aio-debian-gui/host-integration/host_integration.py
          test -f squashfs-root/usr/share/aio-debian-gui/host-integration/payload.json
          rm -rf squashfs-root
          file "$FLATPAK"
          appstreamcli validate --no-net flatpak/io.github.julioayusoalende_hue.aio_debian_gui.metainfo.xml
          flatpak install --user --noninteractive --bundle "$FLATPAK"
          flatpak info --user --show-metadata io.github.julioayusoalende_hue.aio_debian_gui >/dev/null
          flatpak run --user --command=test io.github.julioayusoalende_hue.aio_debian_gui -f /app/lib/aio-debian-gui/aio_core/updates.py
          flatpak run --user --command=test io.github.julioayusoalende_hue.aio_debian_gui -f /app/lib/aio-debian-gui/aio_core/history.py
          flatpak run --user --command=python3 io.github.julioayusoalende_hue.aio_debian_gui -c 'import gi; gi.require_version("Gtk", "3.0"); from gi.repository import Gtk'
          flatpak run --user --command=test io.github.julioayusoalende_hue.aio_debian_gui -x /app/share/aio-debian-gui/host-integration/aio-debian-gui-helper
          flatpak run --user --command=test io.github.julioayusoalende_hue.aio_debian_gui -f /app/share/aio-debian-gui/host-integration/es.aiodebian.gui.policy
          dbus-run-session -- flatpak run --user --command=python3 io.github.julioayusoalende_hue.aio_debian_gui -c '
          import json, subprocess, sys
          sys.path.insert(0, "/app/lib/aio-debian-gui")
          from aio_core import host_integration as integration
          host = lambda *args: ["flatpak-spawn", "--host", *args]
          directory = integration.prepare(host)
          try:
              subprocess.run(host("/usr/bin/python3", "-I", "-c", "import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); assert p.is_dir(); assert (p / \"host_integration.py\").is_file(); d=json.loads((p / \"payload.json\").read_text()); assert d[\"schema\"] == 1; assert len(d[\"files\"]) == 6", directory), check=True)
          finally:
              integration.cleanup(host, directory)
          subprocess.run(host("test", "!", "-e", directory), check=True)
          print("Flatpak real: exportación stdin al anfitrión y limpieza sin privilegios OK")
          '
          flatpak run --user --command=test io.github.julioayusoalende_hue.aio_debian_gui -f /app/share/aio-debian-gui/host-integration/payload.json
          (cd dist && sha256sum *.deb *.AppImage *.flatpak > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: aio-debian-gui-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^Version: //p' package/DEBIAN/control)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; not overwriting previously published assets."
            exit 0
          fi
          gh release create "$TAG" \
            dist/*.deb dist/*.AppImage dist/*.flatpak dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "AiO Debian GUI $VERSION" \
            --notes-file CHANGELOG.md \
            --latest
