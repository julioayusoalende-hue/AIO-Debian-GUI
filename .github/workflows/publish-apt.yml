name: Publish signed APT update repository

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aio-gh-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
      - name: Checkout existing Pages repository
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          persist-credentials: true
      - name: Verify signing key secret
        env:
          PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "::error::Missing GPG_PRIVATE_KEY secret"; exit 1; }
      - name: Install APT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream dpkg-dev gnupg
      - name: Download and verify release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-packages"
          RELEASE_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-packages" --pattern '*.deb' --pattern SHA256SUMS
          cd "$RUNNER_TEMP/release-packages"
          sha256sum --check SHA256SUMS
          for package in aio-debian-gui ayusos-control-center; do
            filename="${package}_${VERSION}_all.deb"
            test -f "$filename"
            awk -v name="$filename" '$2 == name { found=1 } END { exit !found }' SHA256SUMS
          done
          echo "RELEASE_PACKAGES=$RUNNER_TEMP/release-packages" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          mkdir -m 0700 -p "$GNUPGHOME"
          printf '%s\n' 'allow-loopback-pinentry' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Publish signed APT metadata and DEB
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd source
          DEB="$RELEASE_PACKAGES/aio-debian-gui_${RELEASE_VERSION}_all.deb"
          AYUSOS_DEB="$RELEASE_PACKAGES/ayusos-control-center_${RELEASE_VERSION}_all.deb"
          test -f "$DEB"
          test -f "$AYUSOS_DEB"
          bash scripts/publish-apt-repo.sh "$DEB" ../site "" "$AYUSOS_DEB"
      - name: Deploy APT files and retire the portable repositories
        run: |
          set -euo pipefail
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site rm -r --ignore-unmatch -- flatpak-repo host-repo aio-debian-gui.flatpakref aio-debian-gui.flatpakrepo
          git -C site add pool dists aio-debian-gui.gpg index.html .nojekyll
          if git -C site diff --cached --quiet; then
            echo 'APT repository unchanged.'
          else
            git -C site commit -m "Publish signed APT repository from ${GITHUB_SHA:0:12}"
            git -C site push origin HEAD:gh-pages
          fi
