name: Publish signed APT update repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'host-package/**'
      - 'scripts/build-deb.sh'
      - 'scripts/build-host-deb.sh'
      - 'scripts/test-host-package.py'
      - 'scripts/test-host-updater.py'
      - 'scripts/publish-apt-repo.sh'
      - 'scripts/site-index.html'
      - '.github/workflows/publish-apt.yml'

permissions:
  contents: write

concurrency:
  group: aio-gh-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Checkout existing Pages repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: true
      - name: Verify signing key secret
        env:
          PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "::error::Missing GPG_PRIVATE_KEY secret"; exit 1; }
      - name: Install APT build dependencies
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update --error-on=any
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y dpkg-dev fakeroot gnupg
      - name: Build DEBs and import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          mkdir -m 0700 -p "$GNUPGHOME"
          printf '%s\n' 'allow-loopback-pinentry' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          cd source
          bash scripts/build-deb.sh
          bash scripts/build-host-deb.sh
      - name: Test host package and repository publication
        run: |
          cd source
          python3 scripts/test-host-package.py
          python3 scripts/test-host-updater.py
      - name: Publish signed APT metadata and DEB
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd source
          VERSION="$(sed -n 's/^Version: //p' package/DEBIAN/control)"
          DEB="dist/aio-debian-gui_${VERSION}_all.deb"
          test -f "$DEB"
          HOST_DEB="dist/aio-debian-gui-host_${VERSION}_all.deb"
          test -f "$HOST_DEB"
          bash scripts/publish-apt-repo.sh "$DEB" ../site "$HOST_DEB"
      - name: Deploy APT files (preserve Flatpak)
        run: |
          set -euo pipefail
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add pool dists host-repo aio-debian-gui.gpg index.html .nojekyll
          if git -C site diff --cached --quiet; then
            echo 'APT repository unchanged.'
          else
            git -C site commit -m "Publish signed APT repository from ${GITHUB_SHA:0:12}"
            git -C site push origin HEAD:gh-pages
          fi
