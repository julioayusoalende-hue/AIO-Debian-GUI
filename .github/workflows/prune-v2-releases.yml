name: One-time cleanup of obsolete v2 releases
on:
  push:
    branches:
      - maintenance/prune-v2-releases
    paths:
      - .github/workflows/prune-v2-releases.yml
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only superseded v2 releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v2.0.1 v2.0.2 v2.0.3 v2.0.4 v2.0.5 v2.0.6 v2.0.7 v2.0.8; do
            echo "Removing obsolete release and tag: $tag"
            gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done
          echo "Remaining 2.x releases:"
          gh release list --repo "$GH_REPO" --limit 100 | grep -E 'v2\\.' || true
          echo "Preserved release checks:"
          for tag in v2.0.0 v2.0.9 v2.1.0; do
            gh release view "$tag" --repo "$GH_REPO" >/dev/null
          done
