[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-debian-gui"
version = "1.2.4"
description = "Mantenimiento, diagnóstico y copias de configuración para Debian y Ubuntu LTS, desde una interfaz gráfica GTK"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Julio Ayuso", email = "epdc@msn.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    # Runtime dependencies are system packages (python3-gi, gir1.2-gtk-3.0, etc.)
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
    "pytest-xvfb>=1.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
    "pytest-xvfb>=1.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "black>=23.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "E402",  # imports after sys.path / gi.require_version in entry points
    "T201",  # print is the CLI output of helpers and maintenance scripts
    "UP031", # %-formatting is required by the translation catalogues
    "SIM102", "SIM105", "SIM117",  # nested ifs / try-except-pass / with are explicit here
    "C408",  # dict() calls are intentional in option dictionaries
    "UP022", # explicit stdout/stderr pipes keep error messages separate
    "B905",  # zip() without strict: lists are built to the same length
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]  # assert and print allowed in tests

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "gui: marks tests as GUI tests requiring xvfb",
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:gi",
]

[tool.coverage.run]
source = [
    "package/usr/lib/aio-debian-gui/aio_core",
    "package/usr/lib/aio-debian-gui/software_manager",
]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]