app-id: io.github.julioayusoalende_hue.aio_debian_gui
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: aio-debian-gui
branch: stable
appstream-compose: true
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Flatpak
  # Required only for flatpak-spawn --host; does not grant root privileges.
  - --env=AIO_DEBIAN_GUI_VERSION=1.2.5
modules:
  - name: aio-debian-gui
    buildsystem: simple
    build-commands:
      - install -D -m 755 package/usr/bin/aio-debian-gui /app/bin/aio-debian-gui
      - mkdir -p /app/lib/aio-debian-gui
      - cp -a package/usr/lib/aio-debian-gui/aio_core /app/lib/aio-debian-gui/aio_core
      - install -D -m 755 package/usr/lib/aio-debian-gui/aio-debian-gui-helper /app/share/aio-debian-gui/host-integration/aio-debian-gui-helper
      - install -D -m 644 package/usr/share/polkit-1/actions/es.aiodebian.gui.policy /app/share/aio-debian-gui/host-integration/es.aiodebian.gui.policy
      - install -D -m 644 package/usr/share/aio-debian-gui/debian-openlogo.png /app/share/aio-debian-gui/debian-openlogo.png
      - install -D -m 644 package/usr/share/aio-debian-gui/ubuntu-logo.svg /app/share/aio-debian-gui/ubuntu-logo.svg
      - install -D -m 644 package/usr/share/aio-debian-gui/adri-y-lu.jpg /app/share/aio-debian-gui/adri-y-lu.jpg
      - install -D -m 644 package/usr/share/applications/aio-debian-gui.desktop /app/share/applications/io.github.julioayusoalende_hue.aio_debian_gui.desktop
      - sed -i 's/^Icon=aio-debian-gui$/Icon=io.github.julioayusoalende_hue.aio_debian_gui/' /app/share/applications/io.github.julioayusoalende_hue.aio_debian_gui.desktop
      - install -D -m 644 flatpak/io.github.julioayusoalende_hue.aio_debian_gui.metainfo.xml /app/share/metainfo/io.github.julioayusoalende_hue.aio_debian_gui.metainfo.xml
      - cp -a package/usr/share/icons/hicolor /app/share/icons/
      - install -D -m 644 package/usr/share/icons/hicolor/128x128/apps/aio-debian-gui.png /app/share/icons/hicolor/128x128/apps/io.github.julioayusoalende_hue.aio_debian_gui.png
      - install -D -m 644 package/usr/share/icons/hicolor/512x512/apps/aio-debian-gui.png /app/share/icons/hicolor/512x512/apps/io.github.julioayusoalende_hue.aio_debian_gui.png
    sources:
      - type: dir
        path: ..
