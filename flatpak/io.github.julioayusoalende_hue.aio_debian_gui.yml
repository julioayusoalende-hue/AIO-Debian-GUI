app-id: io.github.julioayusoalende_hue.aio_debian_gui
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: aio-debian-gui
appstream-compose: true
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Flatpak
  - --env=AIO_DEBIAN_GUI_VERSION=1.0.16
modules:
  - name: aio-debian-gui
    buildsystem: simple
    build-commands:
      - install -D -m 755 package/usr/bin/aio-debian-gui /app/bin/aio-debian-gui
      - install -D -m 644 package/usr/share/aio-debian-gui/debian-openlogo.png /app/share/aio-debian-gui/debian-openlogo.png
      - install -D -m 644 package/usr/share/aio-debian-gui/adri-y-lu.jpg /app/share/aio-debian-gui/adri-y-lu.jpg
      - install -D -m 644 package/usr/share/applications/aio-debian-gui.desktop /app/share/applications/aio-debian-gui.desktop
      - install -D -m 644 flatpak/io.github.julioayusoalende_hue.aio_debian_gui.metainfo.xml /app/share/metainfo/io.github.julioayusoalende_hue.aio_debian_gui.metainfo.xml
      - cp -a package/usr/share/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: ..
