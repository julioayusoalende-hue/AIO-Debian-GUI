Name:
  C: AiO Debian GUI
Summary:
  fr: Entretenez et configurez Debian et Ubuntu LTS
  zh: 维护和配置 Debian 与 Ubuntu LTS
  C: Maintain and configure Debian and Ubuntu LTS
  es: Mantén y configura Debian y Ubuntu LTS
Description:
  C: >-
    <p>AiO Debian GUI brings system maintenance, diagnostics and configuration together in a graphical interface for Debian
    and Ubuntu LTS. Review package changes before applying them and schedule maintenance to run with the app closed.</p>

    <p>Back up APT repositories and desktop settings, install recommended apps in DEB or Flatpak format, or work in the detachable
    terminal. The startup tab lets you configure GRUB on supported systems.</p>

    <p xml:lang="es">AiO Debian GUI reúne el mantenimiento, el diagnóstico y la configuración de Debian y Ubuntu LTS en una
    interfaz gráfica. Revisa los cambios de paquetes antes de aplicarlos y programa el mantenimiento para que se ejecute con
    la aplicación cerrada.</p>

    <p xml:lang="es">Haz copias de repositorios APT y ajustes del escritorio, instala aplicaciones recomendadas en formato
    DEB o Flatpak y trabaja con una terminal separable. En los sistemas compatibles también puedes configurar GRUB desde la
    pestaña Inicio.</p>

    <p xml:lang="fr">AiO Debian GUI réunit la maintenance, le diagnostic et la configuration de Debian et Ubuntu LTS dans
    une interface graphique. Examinez les changements de paquets et planifiez la maintenance même lorsque l'application est
    fermée.</p>

    <p xml:lang="fr">Sauvegardez les dépôts APT et les réglages du bureau, installez des applications au format DEB ou Flatpak
    et utilisez le terminal détachable. Configurez GRUB sur les systèmes compatibles.</p>

    <p xml:lang="zh">AiO Debian GUI 为 Debian 与 Ubuntu LTS 提供图形化的系统维护、诊断和配置功能。应用软件包更改前可先预览，也可安排关闭应用后自动执行维护。</p>

    <p xml:lang="zh">备份 APT 软件源和桌面设置，安装 DEB 或 Flatpak 应用，并使用可分离的终端。在支持的系统上还可配置 GRUB 启动设置。</p>
