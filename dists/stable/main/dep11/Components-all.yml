Releases:
- version: 1.2.3
  type: stable
  unix-timestamp: 1795478400
  description:
    C: >-
      <ul><li>NVIDIA: si el equipo arranca en EFI y falta mokutil, la app lo instala antes de instalar el controlador. Sin
      él no se puede comprobar Secure Boot y la instalación se rechazaba.</li><li>NVIDIA: la comprobación del módulo DKMS
      acepta el estado installed aunque dkms añada una nota detrás. Si la comprobación falla, el registro muestra el kernel,
      la versión del módulo y la línea de dkms status para saber qué pasa.</li><li>NVIDIA: corregido el falso error «no se
      verificó el módulo DKMS». Debian instala el módulo con el nombre nvidia-current y la app solo buscaba nvidia, así que
      no lo encontraba aunque estuviera compilado.</li><li>NVIDIA: la instalación sigue los pasos de la wiki de Debian para
      Trixie. Activa nvidia-drm modeset=1 y fbdev=1. En equipos con una sola gráfica activa además PreserveVideoMemoryAllocations
      y NVreg_TemporaryFilePath=/var/tmp, necesarios para la suspensión y para que GDM use Wayland. En portátiles con gráfica
      Intel y NVIDIA no se activan, como indica la wiki.</li><li>NVIDIA: si faltan el servidor gráfico X11 (xserver-xorg)
      o las sesiones X11 de GNOME (gnome-session-xsession), se instalan. GDM pasa a X11 cuando no puede usar Wayland con NVIDIA
      y, sin ellos, abortaba con «no session desktop files installed» y la pantalla se quedaba en negro. AyusOS no los trae
      y Debian sí.</li><li>NVIDIA: se instala el panel de control de NVIDIA (nvidia-settings). nvidia-driver solo lo recomienda
      y podía quedar fuera.</li><li>NVIDIA: se instala el metapaquete de cabeceras del kernel (por ejemplo linux-headers-amd64)
      para que el módulo se compile también con los kernels futuros. Con dracut, el initramfs incluye la configuración de
      NVIDIA.</li><li>NVIDIA: si el controlador ya estaba instalado sin esta configuración, la tarea vuelve a aparecer para
      completarla.</li></ul>
