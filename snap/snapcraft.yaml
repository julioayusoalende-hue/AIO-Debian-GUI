name: aio-debian-gui
base: core24
version: '1.2.1'
summary: System maintenance for Debian and Ubuntu LTS
description: |
  AiO Debian GUI is a GTK application for maintenance of Debian and Ubuntu LTS.
  It supports APT, Flatpak, optional distribution-specific repositories,
  previews of maintenance tasks and per-user history.
  This is a development build. System maintenance needs administrator
  authentication and must be tested on supported distributions.
license: GPL-3.0-or-later
website: https://github.com/julioayusoalende-hue/AIO-Debian-GUI
source-code: https://github.com/julioayusoalende-hue/AIO-Debian-GUI
issues: https://github.com/julioayusoalende-hue/AIO-Debian-GUI/issues
grade: devel
# Maintenance changes /etc/apt and invokes pkexec; strict confinement cannot
# provide that access. Classic requires individual Snap Store approval.
confinement: classic

apps:
  aio-debian-gui:
    command: usr/bin/aio-debian-gui-snap
    environment:
      AIO_DEBIAN_GUI_VERSION: '1.2.1'

parts:
  aio-debian-gui:
    plugin: nil
    source: .
    override-build: |
      set -eu
      SRC="$CRAFT_PART_SRC"
      DEST="$CRAFT_PART_INSTALL/usr"
      install -D -m 0755 "$SRC/package/usr/bin/aio-debian-gui" "$DEST/bin/aio-debian-gui"
      install -D -m 0755 "$SRC/snap/local/aio-debian-gui-snap" "$DEST/bin/aio-debian-gui-snap"
      mkdir -p "$DEST/lib/aio-debian-gui"
      cp -a "$SRC/package/usr/lib/aio-debian-gui/aio_core" "$DEST/lib/aio-debian-gui/"
      install -D -m 0755 "$SRC/package/usr/lib/aio-debian-gui/aio-debian-gui-helper" "$DEST/lib/aio-debian-gui/aio-debian-gui-helper"
      cp -a "$SRC/package/usr/share/aio-debian-gui" "$DEST/share/"
      cp -a "$SRC/package/usr/share/icons/hicolor" "$DEST/share/icons/"
      install -D -m 0644 "$SRC/package/usr/share/polkit-1/actions/es.aiodebian.gui.policy" "$DEST/share/polkit-1/actions/es.aiodebian.gui.policy"
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-gtk-3.0
      - python3-cairo
      - librsvg2-common
