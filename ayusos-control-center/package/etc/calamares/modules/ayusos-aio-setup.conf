# Configuración del módulo ayusos-aio-setup
---
enableContribNonFree: true
enableBackports: true
enableBackportsMesa: true
enableFlatpak: true
enableFlathub: true
kernelVariant: "stable"
nvidiaMode: "auto"
nvidiaPrime: true
maintenanceSchedule: "weekly"
maintenanceTime: "03:00"
maintenanceTasks:
  - "upgrade"
  - "autoclean"
  - "flatpak-update"
  - "snap-update"
  - "clean-journal"
  - "rebootcheck"
maintenanceNotify: true
appsProfile: "minimal"
autoInstallApps: true
gnomeExtensions:
  - "gnome-ext-appindicator"
  - "gnome-ext-blur-shell"
  - "gnome-ext-dash-to-dock"
theme: "system"
accent: "ayusos"
wallpaperMode: "auto"
btrfsSnapshots: true
timeshiftSnapshots: true
grubBtrfs: true
snapshotSchedule: "daily"
snapshotRetention: "7d"
runInitialMaintenance: false